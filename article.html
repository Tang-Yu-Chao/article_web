<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>个人博客</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-page="article">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./index.html">个人博客</a>
      <span class="brand-subtitle">Markdown</span>
      <div class="search-wrap">
        <input id="searchInput" class="search-input" type="search" placeholder="搜索文章">
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">文章归档</div>
        <div class="sidebar-subtitle" id="articleCount">0 篇</div>
      </div>
      <div id="sidebarContent"></div>
    </aside>

    <main class="content">
      <div class="content-shell">
        <article class="article-shell">
          <p class="eyebrow">文章</p>
          <h1 id="articleTitle" class="article-title"></h1>
          <div class="article-meta" id="articleMeta"></div>
          <p class="article-summary" id="articleSummary" hidden></p>
          <div id="articleBody" class="article-body"></div>
        </article>
      </div>
    </main>

    <aside class="toc" id="toc">
      <div class="toc-title">本页目录</div>
      <nav id="pageToc"></nav>
    </aside>
  </div>

  <script defer src="./site.js"></script>
</body>
</html>
